<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Check-in / Check-out</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <span class="brand">Hotel Manager</span>
      <nav class="nav">
        <a href="/rooms.html">Rooms</a>
        <a href="/guests.html">Guests</a>
        <a href="/checkin.html" class="active">Check-in / Check-out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Check-in / Check-out</h1>

    <section class="panel">
      <h2>Check-in</h2>
      <form id="checkin-form" class="form">
        <select id="checkin-guest"></select>
        <select id="checkin-room"></select>
        <button type="submit" class="btn btn-primary">Check in</button>
      </form>
    </section>

    <section class="panel">
      <h2>Check-out</h2>
      <form id="checkout-form" class="form">
        <select id="checkout-guest"></select>
        <button type="submit" class="btn btn-danger">Check out</button>
      </form>
    </section>

    <div id="message"></div>
    <script src="/js/checkin.js"></script>
  </main>
</body>
</html>
