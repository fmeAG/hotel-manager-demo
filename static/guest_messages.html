<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Messages (Guest)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <span class="brand">Hotel Manager</span>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/rooms.html">Rooms</a>
        <a href="/guests.html">Guests</a>
        <a href="/checkin.html">Check-in / Check-out</a>
        <a href="/messages.html">Messages</a>
        <span class="nav__divider" aria-hidden="true"></span>
        <a href="/guest_messages.html" class="active">Guest Chat</a>
        <span id="room-label" class="nav__context"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Guest Chat</h1>

    <section id="room-selection" class="panel">
      <h2>Select Room</h2>
      <form id="room-select-form" class="form">
        <label for="room-select">Room</label>
        <select id="room-select" required>
          <option value="">Choose a room</option>
        </select>
        <button type="submit" class="btn btn-primary">Open Chat</button>
      </form>
    </section>

    <section id="send-panel" class="panel" hidden>
      <h2>Send Message</h2>
      <form id="send-form" class="form">
        <input id="send-content" placeholder="Message text" required>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>

    <section id="history-panel" class="panel" hidden>
      <h2>Message History</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Sender</th><th>Content</th><th>Sent</th><th>Status</th><th>Mark read</th></tr>
          </thead>
          <tbody id="messages-body"></tbody>
        </table>
      </div>
    </section>

    <script src="/js/guest_messages.js"></script>
  </main>
</body>
</html>
