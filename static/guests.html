<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Guests</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0066cc; }
    nav a.active { font-weight: bold; color: #333; }
    h1, h2 { margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f4f4f4; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; align-items: center; }
    input { padding: 0.4rem; border: 1px solid #ccc; border-radius: 3px; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    button.danger { background: #cc0000; color: white; border: none; border-radius: 3px; }
    button.edit { background: #0066cc; color: white; border: none; border-radius: 3px; }
  </style>
</head>
<body>
  <nav>
    <a href="/rooms.html">Rooms</a>
    <a href="/guests.html" class="active">Guests</a>
    <a href="/checkin.html">Check-in / Check-out</a>
  </nav>
  <h1>Guests</h1>

  <h2>Add Guest</h2>
  <form id="add-form">
    <input id="first-name" placeholder="First name" required>
    <input id="last-name" placeholder="Last name" required>
    <button type="submit">Add</button>
  </form>

  <h2>Guest List</h2>
  <table>
    <thead>
      <tr><th>Name</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Actions</th></tr>
    </thead>
    <tbody id="guests-body"></tbody>
  </table>

  <script src="/js/guests.js"></script>
</body>
</html>
