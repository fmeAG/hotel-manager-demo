<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Guests</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <span class="brand">Hotel Manager</span>
      <nav class="nav">
        <a href="/rooms.html">Rooms</a>
        <a href="/guests.html" class="active">Guests</a>
        <a href="/checkin.html">Check-in / Check-out</a>
        <a href="/messages.html">Messages</a>
        <span class="nav__divider" aria-hidden="true"></span>
        <a href="/guest_messages.html">Guest Chat</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Guests</h1>

    <section class="panel">
      <h2>Add Guest</h2>
      <form id="add-form" class="form">
        <input id="first-name" placeholder="First name" required>
        <input id="last-name" placeholder="Last name" required>
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <section class="panel">
      <h2>Guest List</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Actions</th></tr>
          </thead>
          <tbody id="guests-body"></tbody>
        </table>
      </div>
    </section>

    <dialog id="edit-guest-dialog" class="dialog">
      <form id="edit-form" class="form form--stacked">
        <h2>Edit Guest</h2>
        <div class="field">
          <label for="edit-first-name">First name</label>
          <input id="edit-first-name" required>
        </div>
        <div class="field">
          <label for="edit-last-name">Last name</label>
          <input id="edit-last-name" required>
        </div>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="/js/guests.js"></script>
  </main>
</body>
</html>
