<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Messages</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <span class="brand">Hotel Manager</span>
      <nav class="nav">
        <a href="/rooms.html">Rooms</a>
        <a href="/guests.html">Guests</a>
        <a href="/checkin.html">Check-in / Check-out</a>
        <a href="/messages.html" class="active">Messages</a>
        <span class="nav__divider" aria-hidden="true"></span>
        <a href="/guest_messages.html">Guest Chat</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Messages</h1>

    <section class="panel">
      <h2>Send Message</h2>
      <form id="send-form" class="form">
        <select id="send-room" required></select>
        <input id="send-sender" placeholder="Sender" value="Reception" required>
        <input id="send-content" placeholder="Message text" required>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>

    <section class="panel">
      <h2>Message List</h2>
      <form id="filter-form" class="form">
        <select id="filter-room">
          <option value="">All rooms</option>
        </select>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Room</th><th>Sender</th><th>Content</th><th>Sent</th><th>Status</th><th>Advance</th><th>Guest view</th></tr>
          </thead>
          <tbody id="messages-body"></tbody>
        </table>
      </div>
    </section>

    <script src="/js/messages.js"></script>
  </main>
</body>
</html>
